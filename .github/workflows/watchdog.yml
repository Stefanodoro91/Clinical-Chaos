name: Guardiano del calendario

# Svegliato ogni 10 minuti da un orologio esterno affidabile (Cloudflare Worker, tools/clock-worker.js) e, come
# riserva, dal cron di GitHub (che però spesso salta). Se un post o una storia di oggi non è uscito, lo lancia a
# mano: al massimo 2 tentativi per tipo al giorno, poi apre un avviso.
on:
  schedule:
    - cron: "11,41 7-20 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: watchdog          # due sveglie vicine non lanciano lo stesso recupero due volte
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/watchdog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
