name: Anteprima carosello e reel Funding e Positions

# Testo e logiche: Claude Sonnet 5.5; immagine di copertina: ChatGPT (GPT Image 2). Non pubblica niente:
# carosello (PDF) e reel (MP4) vanno nei file segnaposto su Drive indicati in `files`.
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'JSON {"grant_pdf","grant_reel","positions_pdf","positions_reel"} con gli id dei file Drive'
        required: true
      kinds:
        description: "grant, positions o entrambi (grant,positions)"
        default: "grant,positions"
      writer:
        description: "modello scrittore (vuoto = catene normali del bot)"
        default: "paid:anthropic/claude-sonnet-5.5"
      budget:
        description: "tetto di spesa in $"
        default: "2"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Anteprime
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_DONE_FOLDER_ID: ${{ secrets.GDRIVE_DONE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PREVIEW_FILES: ${{ inputs.files }}
          KINDS: ${{ inputs.kinds }}
          WRITER: ${{ inputs.writer }}
          AI_PAID_BUDGET: ${{ inputs.budget }}
          PYTHONUNBUFFERED: "1"
        run: python tools/rubric_preview.py
      - name: Carica file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anteprime-rubriche
          path: compare_out/
