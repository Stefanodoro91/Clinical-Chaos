name: Post giornaliero ricerca clinica

on:
  # Due post al giorno, ora italiana (GitHub può partire con qualche minuto di ritardo):
  # alle 12:30 un bando, alle 23:30 un post di metodologia; il lunedì alle 18:30 la raccolta di posizioni accademiche;
  # mercoledì e sabato alle 19:00 un reel ricavato dal carosello di metodologia più recente.
  schedule:
    # Orari in UTC: GitHub ignora il fuso orario. Inverno (fino al 28/3/2027) = ora di Roma - 1; in estate - 2.
    - cron: "30 11 * * *"   # 12:30 a Roma
    - cron: "30 22 * * *"   # 23:30 a Roma
    - cron: "30 17 * * 1"   # lunedì 18:30 a Roma
    - cron: "0 18 * * 3,6"   # 19:00 a Roma
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo prova (non pubblica, salva un'anteprima)"
        type: boolean
        default: true
      post_type:
        description: "Tipo di post: research = metodologia, grant = bando, positions = posizioni accademiche"
        type: choice
        options: [research, grant, positions, announcement, reel]
        default: research
      positions_count:
        description: "Solo per positions: quante posizioni nel post (vuoto = raccolta settimanale normale)"
        default: ""
      reel_source:
        description: "Solo per reel: latest = dal carosello di metodologia più recente, announcement = reel speciale"
        type: choice
        options: [latest, announcement]
        default: latest

permissions:
  contents: write   # per salvare immagini e registro nel repository
  issues: write     # per gli avvisi via email

concurrency:
  group: instagram-publish   # i post hanno una coda loro: un aggiornamento non può annullarli
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Configura git
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pubblica il post del giorno
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_DONE_FOLDER_ID: ${{ secrets.GDRIVE_DONE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          POSITIONS_PER_POST: ${{ inputs.positions_count }}
          REEL_SOURCE: ${{ inputs.reel_source }}
          POST_TYPE: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 11 * * *' && 'grant' || (github.event.schedule == '30 17 * * 1' && 'positions' || (github.event.schedule == '0 18 * * 3,6' && 'reel' || 'research'))) || inputs.post_type || 'research' }}
        run: python bot.py

      - name: Salva anteprima (solo in modalità prova)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
          if-no-files-found: ignore
