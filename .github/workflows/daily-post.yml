name: Post giornaliero ricerca clinica
# Il tipo compare nel nome anche per i run pianificati: il guardiano (tools/watchdog.py) li distingue così.
run-name: "Post ${{ github.event_name == 'schedule' && format('{0} (pianificato)', ((github.event.schedule == '23 11 * * 1,2,4,5' || github.event.schedule == '23 12 * * 1,2,4,5') && 'grant' || ((github.event.schedule == '23 17 * * 1' || github.event.schedule == '23 18 * * 1') && 'positions' || ((github.event.schedule == '23 11 * * 3' || github.event.schedule == '23 12 * * 3' || github.event.schedule == '47 16 * * 0' || github.event.schedule == '47 17 * * 0') && 'reel' || 'research')))) || inputs.post_type }}${{ inputs.dry_run == true && ' (prova)' || '' }}"

on:
  # Calendario (ora italiana; GitHub può partire con qualche minuto di ritardo), uguale su Instagram, Facebook,
  # Threads e Bluesky, ognuno nel suo formato:
  #   bandi        lun, mar, gio, ven 12:23  (pausa pranzo: picco di Facebook e buon orario per Instagram)
  #                rubrica «Before you apply» il venerdì ogni due settimane (settimane ISO pari)
  #   metodologia  mar, mer, gio 18:47 e sab 16:47  (sera infrasettimanale e sabato pomeriggio: picchi di Instagram e Bluesky)
  #                rubriche: «Checklist» il giovedì (una voce CONSORT/PRISMA/STROBE/SPIRIT/COSMIN, senza AI),
  #                «Clinical Insights» il sabato (post con articolo citabile e slide «Based on»)
  #   posizioni    lun 18:23  (inizio settimana, quando si cercano opportunità)
  #                rubrica «Career Path» il primo lunedì del mese (glossario dei ruoli)
  #   reel         mer 12:23 e dom 17:47, a rotazione: metodologia (classica), bando (rock), posizioni (funky),
  #                speciale (aziendale); attivi con config reels_auto = true
  # Le rubriche si spengono con config rubrics = false.
  # Storie: workflow stories.yml (lun-ven 9:31).
  # Minuti «dispari» apposta: allo scoccare dell'ora e della mezz'ora GitHub è più carico e i run pianificati
  # vengono ritardati o saltati (il 27/10 nessun run delle 12:30 è partito).
  schedule:
    # Orari in UTC: GitHub ignora il fuso orario. Inverno (fino al 28/3/2027) = ora di Roma - 1; in estate - 2.
    - cron: "23 11 * * 1,2,4,5"   # bando, 12:23 a Roma
    - cron: "47 17 * * 2,3,4"     # metodologia, 18:47 a Roma
    - cron: "47 15 * * 6"         # metodologia, sabato 16:47 a Roma
    - cron: "23 17 * * 1"         # posizioni, lunedì 18:23 a Roma
    - cron: "23 11 * * 3"         # reel, mercoledì 12:23 a Roma
    - cron: "47 16 * * 0"         # reel, domenica 17:47 a Roma
    # riserve un'ora dopo: GitHub a volte salta o ritarda i run pianificati; se il post è già uscito, il run salta da solo
    - cron: "23 12 * * 1,2,4,5"   # riserva bando, 13:23 a Roma
    - cron: "47 18 * * 2,3,4"     # riserva metodologia, 19:47 a Roma
    - cron: "47 16 * * 6"         # riserva metodologia, sabato 17:47 a Roma
    - cron: "23 18 * * 1"         # riserva posizioni, lunedì 19:23 a Roma
    - cron: "23 12 * * 3"         # riserva reel, mercoledì 13:23 a Roma
    - cron: "47 17 * * 0"         # riserva reel, domenica 18:47 a Roma
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo prova (non pubblica, salva un'anteprima)"
        type: boolean
        default: true
      post_type:
        description: "Tipo di post: research = metodologia, grant = bando, positions = posizioni accademiche"
        type: choice
        options: [research, grant, positions, announcement, reel]
        default: research
      positions_count:
        description: "Solo per positions: quante posizioni nel post (vuoto = raccolta settimanale normale)"
        default: ""
      reel_source:
        description: "Solo per reel: latest = a rotazione tra i tipi; research/grant/positions/special = dal carosello di quel tipo; announcement = reel di reel_announcement.json"
        type: choice
        options: [latest, research, grant, positions, special, announcement, crosspost]
        default: latest

permissions:
  contents: write   # per salvare immagini e registro nel repository
  issues: write     # per gli avvisi via email

concurrency:
  group: instagram-publish   # i post hanno una coda loro: un aggiornamento non può annullarli
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Configura git
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pubblica il post del giorno
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_DONE_FOLDER_ID: ${{ secrets.GDRIVE_DONE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          POSITIONS_PER_POST: ${{ inputs.positions_count }}
          REEL_SOURCE: ${{ inputs.reel_source }}
          SCHEDULE: ${{ github.event.schedule }}
          POST_TYPE: ${{ github.event_name == 'schedule' && ((github.event.schedule == '23 11 * * 1,2,4,5' || github.event.schedule == '23 12 * * 1,2,4,5') && 'grant' || ((github.event.schedule == '23 17 * * 1' || github.event.schedule == '23 18 * * 1') && 'positions' || ((github.event.schedule == '23 11 * * 3' || github.event.schedule == '23 12 * * 3' || github.event.schedule == '47 16 * * 0' || github.event.schedule == '47 17 * * 0') && 'reel' || 'research'))) || inputs.post_type || 'research' }}
        run: python bot.py

      - name: Salva anteprima (solo in modalità prova)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: preview/
          if-no-files-found: ignore
