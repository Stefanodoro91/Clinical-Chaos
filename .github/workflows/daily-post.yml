name: Post giornaliero ricerca clinica
# Il tipo compare nel nome anche per i run pianificati: il guardiano (tools/watchdog.py) li distingue così.
run-name: "Post ${{ github.event_name == 'schedule' && format('{0} (pianificato)', (
    (github.event.schedule == '23 11 * * 1' || github.event.schedule == '23 12 * * 1') && 'grant' ||
    (github.event.schedule == '23 17 * * 1' || github.event.schedule == '23 18 * * 1') && 'positions' ||
    (github.event.schedule == '47 17 * * 2' || github.event.schedule == '47 18 * * 2') && 'research' ||
    (github.event.schedule == '23 11 * * 3' || github.event.schedule == '23 12 * * 3') && 'reel' ||
    (github.event.schedule == '47 17 * * 4' || github.event.schedule == '47 18 * * 4') && 'reel' ||
    (github.event.schedule == '23 14 * * 5' || github.event.schedule == '23 15 * * 5') && 'reel' ||
    (github.event.schedule == '47 15 * * 6' || github.event.schedule == '47 16 * * 6') && 'science' ||
    (github.event.schedule == '47 16 * * 0' || github.event.schedule == '47 17 * * 0') && 'reel' ||
    'research')) || inputs.post_type }}${{ inputs.dry_run == true && ' (prova)' || '' }}"

on:
  # Calendario (ora italiana; GitHub può partire con qualche minuto di ritardo), uguale su Instagram, Facebook,
  # Threads e Bluesky, ognuno nel suo formato:
  #   bandi        lun, mar, gio, ven 12:23  (pausa pranzo: picco di Facebook e buon orario per Instagram)
  #                rubrica «Before you apply» il venerdì ogni due settimane (settimane ISO pari)
  #   metodologia  mar, mer, gio 18:47 e sab 16:47  (sera infrasettimanale e sabato pomeriggio: picchi di Instagram e Bluesky)
  #                rubriche: «Checklist» il giovedì (una voce CONSORT/PRISMA/STROBE/SPIRIT/COSMIN, senza AI),
  #                «Clinical Insights» il sabato (post con articolo citabile e slide «Based on»)
  #   posizioni    lun 18:23  (inizio settimana, quando si cercano opportunità)
  #                rubrica «Career Path» il primo lunedì del mese (glossario dei ruoli)
  #   reel         mer 12:23, ven 15:23 e dom 17:47, a rotazione: metodologia (classica), bando (rock),
  #                posizioni (funky), speciale (aziendale); attivi con config reels_auto = true
  # Le rubriche si spengono con config rubrics = false.
  # Storie: workflow stories.yml (lun-ven 9:31).
  # Minuti «dispari» apposta: allo scoccare dell'ora e della mezz'ora GitHub è più carico e i run pianificati
  # vengono ritardati o saltati (il 27/10 nessun run delle 12:30 è partito).
  schedule:
    # Calendario v4 — 1 carosello + 1 reel per rubrica a settimana (ora di Roma; inverno = UTC+1):
    #   Lunedì    12:23  Funding carosello
    #   Lunedì    18:23  Positions carosello
    #   Martedì   18:47  Design, Reporting & Appraisal carosello
    #   Mercoledì 12:23  Funding reel
    #   Giovedì   18:47  Design, Reporting & Appraisal reel
    #   Venerdì   15:23  Positions reel
    #   Sabato    16:47  Latest Science carosello
    #   Domenica  17:47  Latest Science reel
    # Storie: lun-ven 08:31 (stories.yml, invariate)
    # Riserve un'ora dopo ogni slot: se il post è già uscito, il run salta da solo
    - cron: "23 11 * * 1"         # Funding carosello, lunedì 12:23 Roma
    - cron: "23 17 * * 1"         # Positions carosello, lunedì 18:23 Roma
    - cron: "47 17 * * 2"         # Design carosello, martedì 18:47 Roma
    - cron: "23 11 * * 3"         # Funding reel, mercoledì 12:23 Roma
    - cron: "47 17 * * 4"         # Design reel, giovedì 18:47 Roma
    - cron: "23 14 * * 5"         # Positions reel, venerdì 15:23 Roma
    - cron: "47 15 * * 6"         # Latest Science carosello, sabato 16:47 Roma
    - cron: "47 16 * * 0"         # Latest Science reel, domenica 17:47 Roma
    # riserve
    - cron: "23 12 * * 1"         # riserva Funding carosello, 13:23 Roma
    - cron: "23 18 * * 1"         # riserva Positions carosello, 19:23 Roma
    - cron: "47 18 * * 2"         # riserva Design carosello, 19:47 Roma
    - cron: "23 12 * * 3"         # riserva Funding reel, 13:23 Roma
    - cron: "47 18 * * 4"         # riserva Design reel, 19:47 Roma
    - cron: "23 15 * * 5"         # riserva Positions reel, 16:23 Roma
    - cron: "47 16 * * 6"         # riserva Latest Science carosello, 17:47 Roma
    - cron: "47 17 * * 0"         # riserva Latest Science reel, 18:47 Roma
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo prova (non pubblica, salva un'anteprima)"
        type: boolean
        default: true
      post_type:
        description: "Tipo di post: research = metodologia, grant = bando, positions = posizioni accademiche"
        type: choice
        options: [research, grant, positions, announcement, reel]
        default: research
      positions_count:
        description: "Solo per positions: quante posizioni nel post (vuoto = raccolta settimanale normale)"
        default: ""
      reel_source:
        description: "Solo per reel: latest = a rotazione tra i tipi; research/grant/positions/special = dal carosello di quel tipo; announcement = reel di reel_announcement.json"
        type: choice
        options: [latest, research, grant, positions, special, announcement, crosspost]
        default: latest
      reel_of:
        description: "Solo per reel: id del post di cui pubblicare il reel (vuoto = automatico)"
        default: ""

permissions:
  contents: write   # per salvare immagini e registro nel repository
  issues: write     # per gli avvisi via email

concurrency:
  group: instagram-publish   # i post hanno una coda loro: un aggiornamento non può annullarli
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Configura git
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pubblica il post del giorno
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          PYTHONUNBUFFERED: "1"   # senza questo l'output resta nel buffer e un run ucciso dal timeout non lascia log
          GDRIVE_DONE_FOLDER_ID: ${{ secrets.GDRIVE_DONE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          POSITIONS_PER_POST: ${{ inputs.positions_count }}
          REEL_SOURCE: ${{ inputs.reel_source }}
          REEL_OF: ${{ inputs.reel_of }}
          SCHEDULE: ${{ github.event.schedule }}
          POST_TYPE: ${{ github.event_name == 'schedule' && (
            (github.event.schedule == '23 11 * * 1' || github.event.schedule == '23 12 * * 1') && 'grant' ||
            (github.event.schedule == '23 17 * * 1' || github.event.schedule == '23 18 * * 1') && 'positions' ||
            (github.event.schedule == '47 17 * * 2' || github.event.schedule == '47 18 * * 2') && 'research' ||
            (github.event.schedule == '23 11 * * 3' || github.event.schedule == '23 12 * * 3') && 'reel' ||
            (github.event.schedule == '47 17 * * 4' || github.event.schedule == '47 18 * * 4') && 'reel' ||
            (github.event.schedule == '23 14 * * 5' || github.event.schedule == '23 15 * * 5') && 'reel' ||
            (github.event.schedule == '47 15 * * 6' || github.event.schedule == '47 16 * * 6') && 'science' ||
            (github.event.schedule == '47 16 * * 0' || github.event.schedule == '47 17 * * 0') && 'reel' ||
            'research') || inputs.post_type || 'research' }}
        run: python bot.py

      - name: Salva anteprima (solo in modalità prova)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
          if-no-files-found: ignore
