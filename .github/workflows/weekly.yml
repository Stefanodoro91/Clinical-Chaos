name: Resoconto settimanale

# Ogni lunedì mattina: messaggio pronto per il canale WhatsApp e resoconto (bandi e posizioni per regione e area,
# post della settimana, fonti che rendono e fonti rotte). Arriva per email come issue (chiusa subito).
on:
  schedule:
    # Orari in UTC: GitHub ignora il fuso orario. Inverno (fino al 28/3/2027) = ora di Roma - 1; in estate - 2.
    - cron: "41 7 * * 1"    # lunedì 08:41 a Roma
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configura git
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Messaggio WhatsApp e resoconto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py --weekly
