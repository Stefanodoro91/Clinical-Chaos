name: Controlla token Instagram

# Ogni lunedì controlla scadenza e permessi del token Instagram (senza mostrarlo)
# e apre un avviso se scade entro 14 giorni.
on:
  schedule:
    - cron: "41 8 * * 1"
      timezone: "Europe/Rome"
  workflow_dispatch:
    inputs:
      test_facebook:
        description: "Prova reale su Facebook (foto non pubblicata, cancellata subito)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Controlla il token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FB_TEST: ${{ inputs.test_facebook || 'false' }}
        run: python bot.py --token
