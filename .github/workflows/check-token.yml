name: Controlla token Instagram

# Ogni lunedì controlla scadenza e permessi del token Instagram (senza mostrarlo)
# e apre un avviso se scade entro 14 giorni.
on:
  schedule:
    - cron: "41 8 * * 1"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Controlla il token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py --token
