name: Controlla token Instagram

# Ogni lunedì controlla scadenza e permessi del token Instagram (senza mostrarlo)
# e apre un avviso se scade entro 14 giorni.
on:
  schedule:
    # Orari in UTC: GitHub ignora il fuso orario. Inverno (fino al 28/3/2027) = ora di Roma - 1; in estate - 2.
    - cron: "41 7 * * 1"    # lunedì 08:41 a Roma
  workflow_dispatch:
    inputs:
      test_facebook:
        description: "Prova reale su Facebook (foto non pubblicata, cancellata subito)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Controlla il token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FB_TEST: ${{ inputs.test_facebook || 'false' }}
        run: python bot.py --token
