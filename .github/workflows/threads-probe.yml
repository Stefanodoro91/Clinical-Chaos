name: Diagnosi video Threads (non pubblica)

# Crea contenitori video su Threads con varianti e legge lo stato: non chiama mai threads_publish.
on:
  workflow_dispatch:
    inputs:
      our_url:
        description: "URL pubblico del video convertito"
        default: "https://clinicalresearchchaos.com/reels/reel-positions-2026-11-09-threads.mp4"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Prova
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          OUR_URL: ${{ inputs.our_url }}
          PYTHONUNBUFFERED: "1"
        run: python tools/threads_probe.py
