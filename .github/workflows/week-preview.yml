name: Settimana di prova su Drive

# Prepara tutte le uscite di una settimana come se il bot pubblicasse e le salva su Drive. Con preview_weeks.json
# (piano a più settimane) fa la prima settimana non ancora pronta: un giro al giorno, dentro la quota giornaliera dei
# modelli. Prima delle anteprime fa lo screening (bandi nuovi sui modelli leggeri, secondo parere dei forti sui
# bandi e sulle posizioni ad alta priorità). Non pubblica niente: sul ramo salva solo preview_history.json e il
# consumo dei modelli (usage/), mai su main.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Solo alcune uscite (numeri separati da virgola, vuoto = tutte)"
        default: ""
      screening:
        description: "Screening dei bandi prima delle anteprime (0 = salta, per risparmiare la quota di Gemini)"
        default: "1"
      reuse_clinical:
        description: "Latest Science: riusa gli articoli già usati (data AAAA-MM-GG da cui contare i riusi; vuoto = no)"
        default: ""

permissions:
  contents: write

concurrency:
  group: week-preview
  cancel-in-progress: false

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Dati e quote di oggi da main
        # quote condivise con i giri di main; bandi, posizioni, coda e pubblicazioni simulate più recenti sono su main
        run: |
          git fetch --depth=1 origin main
          git checkout origin/main -- usage grants_verified.json positions.json posted_log.json queue.json stories_log.json || true
          git reset -q
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installa dipendenze
        run: |
          pip install -r requirements.txt
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Screening e settimana di prova
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_DONE_FOLDER_ID: ${{ secrets.GDRIVE_DONE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONLY: ${{ inputs.only }}
          SCREENING: ${{ inputs.screening || '1' }}
          REUSE_CLINICAL_SINCE: ${{ inputs.reuse_clinical }}
        run: python tools/week_preview.py
      - name: Riepilogo
        if: always()
        run: cat week_report.txt || true
      - name: Salva avanzamento e consumo sul ramo (mai su main)
        if: always() && github.ref_name != 'main'
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/keep && cp preview_history.json /tmp/keep/ 2>/dev/null || true
          cp usage/*-${GITHUB_RUN_ID}.json /tmp/keep/ 2>/dev/null || true
          git stash -u -q || true
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          mkdir -p usage
          cp /tmp/keep/preview_history.json . 2>/dev/null || true
          cp /tmp/keep/*-${GITHUB_RUN_ID}.json usage/ 2>/dev/null || true
          git add preview_history.json usage/*-${GITHUB_RUN_ID}.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "Anteprime: avanzamento del piano e consumo modelli" && git push -q origin "HEAD:$GITHUB_REF_NAME")
      - name: Copia delle uscite e consumo modelli
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settimana-di-prova
          path: |
            preview_week/
            week_report.txt
            preview_history.json
            usage/
          retention-days: 14
