name: Diagnostica quota Gemini (temporaneo)
on:
  workflow_dispatch:
jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests && python tools/quota.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
