name: Confronto modelli di immagini

# Un articolo su Drive → prompt scritto da un modello → immagine da un modello Gemini e uno OpenAI (OpenRouter).
# Non pubblica niente: il PDF con prompt e immagini va nel file segnaposto su Drive.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "parte del nome del PDF su Drive"
        default: "Smart exoskeleton"
      models:
        description: "slug OpenRouter separati da virgola"
        default: "google/gemini-3.1-flash-image,openai/gpt-image-2"
      pdf_id:
        description: "id del file Drive che riceve il PDF"
        default: "1L1_5nYzFYq5Hv6jDDnaiQtfXIsD49gYH"

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Immagini
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_DONE_FOLDER_ID: ${{ secrets.GDRIVE_DONE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SOURCE: ${{ inputs.source }}
          IMAGE_MODELS: ${{ inputs.models }}
          PDF_ID: ${{ inputs.pdf_id }}
          PYTHONUNBUFFERED: "1"
        run: python tools/image_compare.py
      - name: Carica immagini
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confronto-immagini
          path: compare_out/
