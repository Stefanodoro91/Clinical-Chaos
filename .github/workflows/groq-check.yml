name: Controllo Groq (temporaneo)
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - name: Controllo doppioni con il codice del bot
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 -c "
          import content
          out = content._groq_json('Titoli: 1) Blinding in RCTs 2) Blinding in randomised controlled trials 3) PICO basics. Quali numeri sono doppioni?', {'type':'OBJECT','properties':{'duplicates':{'type':'ARRAY','items':{'type':'INTEGER'}}}}, 0.0, 'controllo doppioni')
          print('::notice title=Groq dal bot::', out, content.USAGE)
          "
