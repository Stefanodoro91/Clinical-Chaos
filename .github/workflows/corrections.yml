name: Rettifiche dei post

# Pubblica le rettifiche elencate in corrections.json: commento sotto il post Instagram
# e riga di correzione in testa al post Facebook. Si lancia a mano.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  corrections:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configura git
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Pubblica le rettifiche
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py --corrections
