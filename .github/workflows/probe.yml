name: Diagnostica fonti (temporaneo)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tools/probe.py tools/probe_urls.txt
      - run: |
          git config user.name probe-bot && git config user.email probe@users.noreply.github.com
          git checkout -B probe-results && git add -f probe_results.txt && git commit -qm "risultati diagnostica" && git push -f origin probe-results
