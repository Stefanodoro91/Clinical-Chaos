name: Sonda e confronto modelli AI per operazione
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ai = confronto modelli; figures = prova estrazione figure dagli articoli clinici"
        default: "ai"
permissions:
  contents: read
jobs:
  bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Confronto
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_DONE_FOLDER_ID: ${{ secrets.GDRIVE_DONE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: "true"
        run: |
          if [ "${{ inputs.mode }}" = "figures" ]; then python tools/figure_probe.py; else python tools/ai_probe.py; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe
          path: |
            probe.md
            probe_fig/
          if-no-files-found: ignore
