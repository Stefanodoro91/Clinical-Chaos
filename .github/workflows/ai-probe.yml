name: Sonda e confronto modelli AI per operazione
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ai = confronto modelli; figures = figure dagli articoli clinici; visuals = schemi; links = verifica link della tabella strumenti"
        default: "ai"
permissions:
  contents: write
jobs:
  bakeoff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Confronto
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_DONE_FOLDER_ID: ${{ secrets.GDRIVE_DONE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DRY_RUN: "true"
        run: |
          if [ "${{ inputs.mode }}" = "figures" ]; then python tools/figure_probe.py; elif [ "${{ inputs.mode }}" = "visuals" ]; then python tools/visual_probe.py; elif [ "${{ inputs.mode }}" = "links" ]; then python tools/link_probe.py; elif [ "${{ inputs.mode }}" = "reels" ]; then python tools/kickoff_reels.py; else python tools/ai_probe.py; fi
      - name: Figure su un ramo di prova (solo modalità figures)
        if: always() && (inputs.mode == 'figures' || inputs.mode == 'visuals' || inputs.mode == 'reels')
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/pf && cp -r probe_fig probe.md /tmp/pf/ 2>/dev/null || true
          git checkout -q --orphan probe-figures && git rm -rq --cached . && git clean -fdq -e probe_fig -e probe.md
          cp -r /tmp/pf/* . && git add probe_fig probe.md && git commit -qm "Prova figure" && git push -qf origin probe-figures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: probe
          path: |
            probe.md
            probe_fig/
          if-no-files-found: ignore
