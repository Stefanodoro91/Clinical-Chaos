name: Rigenera la coda dei post

# Rilegge i file già elaborati su Drive e riscrive la coda con evidenziazioni e reference,
# senza ripetere gli argomenti già pubblicati. Non pubblica niente su Instagram.
on:
  workflow_dispatch:
    inputs:
      restart:
        description: "Riparti da capo: svuota la coda e rileggi tutti i documenti della cartella Drive"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configura git
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rigenera
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_DONE_FOLDER_ID: ${{ secrets.GDRIVE_DONE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py ${{ inputs.restart && '--restart' || '--rebuild' }}
