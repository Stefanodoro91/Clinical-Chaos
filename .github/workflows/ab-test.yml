name: Confronto A/B token (temporaneo)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: instagram-post
  cancel-in-progress: false
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python tools/ab_test.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - run: |
          git config user.name research-bot && git config user.email research-bot@users.noreply.github.com
          git add ab && git commit -qm "Risultati del confronto A/B" && (git push || (git pull --rebase -X theirs && git push))
