name: Aggiorna bandi e pagina link in bio

# Ogni giorno verifica sul testo ufficiale i bandi nuovi trovati da GrantFinder (programma, Paesi
# ammessi, Italia, sommario) e rigenera la pagina «link in bio». Non pubblica niente su Instagram.
on:
  schedule:
    # Orari in UTC: GitHub ignora il fuso orario. Inverno (fino al 28/3/2027) = ora di Roma - 1; in estate - 2.
    - cron: "17 6 * * *"    # 07:17 a Roma
    - cron: "17 16 * * *"   # 17:17 a Roma
    - cron: "17 10 * * *"   # 11:17 a Roma
    - cron: "17 20 * * *"   # 21:17 a Roma
  workflow_dispatch:
    inputs:
      limit:
        description: "Quanti bandi nuovi verificare (vuoto = valore di config.json)"
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  grants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configura git
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verifica bandi e aggiorna la pagina
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GRANT_VERIFY_LIMIT: ${{ inputs.limit }}
        run: python bot.py --grants
