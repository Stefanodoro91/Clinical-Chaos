name: Aggiorna bandi e pagina link in bio

# Ogni giorno verifica sul testo ufficiale i bandi nuovi trovati da GrantFinder (programma, Paesi
# ammessi, Italia, sommario) e rigenera la pagina «link in bio». Non pubblica niente su Instagram.
on:
  schedule:
    - cron: "17 7 * * *"
      timezone: "Europe/Rome"
    - cron: "17 17 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:
    inputs:
      limit:
        description: "Quanti bandi nuovi verificare (vuoto = valore di config.json)"
        default: ""

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  grants:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Configura git
        run: |
          git config user.name "research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verifica bandi e aggiorna la pagina
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GRANT_VERIFY_LIMIT: ${{ inputs.limit }}
        run: python bot.py --grants
